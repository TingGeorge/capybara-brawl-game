<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>介面預覽（開發用）</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* 開發工具列（只在預覽頁出現） */
    #devbar {
      position: fixed;
      left: 6px;
      bottom: 6px;
      z-index: 100;
      max-width: 46vw;
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 5px;
      font: 12px/1.2 sans-serif;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid #000;
    }
    #devbar b { width: 100%; color: #ffd34d; margin-top: 2px; }
    #devbar button {
      font: inherit;
      padding: 2px 6px;
      color: #fff;
      background: #2b3469;
      border: 1px solid #6f78b3;
      cursor: pointer;
    }
    #devbar button:hover { background: #38428a; }
    #devbar.min > :not(.toggle) { display: none; }
  </style>
</head>
<body>
  <div id="devbar">
    <button class="toggle" type="button" data-act="min">－ 收合</button>
  </div>
  <script type="module" src="./ui-preview.js"></script>
</body>
</html>
